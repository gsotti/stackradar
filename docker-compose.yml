services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-logpilot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-logpilot_password}
      - POSTGRES_DB=${POSTGRES_DB:-logpilot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  logpilot:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-change-me}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-logpilot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-logpilot_password}
      - POSTGRES_DB=${POSTGRES_DB:-logpilot}
    volumes:
      - logpilot-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  test-logger:
    build: ./test-logger
    environment:
      - API_TOKEN=62b81c04d47245efb82fae99282998158b72e4a8683b46d494e57a38e45d180e
      - API_URL=http://host.docker.internal:8000
      - SYSTEM_NAME=Test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  logpilot-data:
  postgres-data:
