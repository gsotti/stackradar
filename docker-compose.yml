  # postgres:
  #   image: postgres:17-alpine
  #   environment:
  #     - POSTGRES_USER=${POSTGRES_USER:-logpilot}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-logpilot_password}
  #     - POSTGRES_DB=${POSTGRES_DB:-logpilot}
  #     - POSTGRES_PORT=${POSTGRES_PORT:-5432}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logpilot}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  stackradar:
    build: .
    #image:  ghcr.io/gsotti/stackradar:latest
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - stackradar-data:/app/data
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  stackradar-data:
  # postgres-data:
