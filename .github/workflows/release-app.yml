name: Release App

on:
  push:
    tags:
      - 'v*-app'
      - 'v*-app-dev'

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version and channel
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" == *-app-dev ]]; then
            echo "VERSION=$(echo $TAG | sed 's/-app-dev$//')" >> $GITHUB_OUTPUT
            echo "CHANNEL=dev-latest" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(echo $TAG | sed 's/-app$//')" >> $GITHUB_OUTPUT
            echo "CHANNEL=latest" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/gsotti/stackradar:${{ steps.version.outputs.VERSION }}
            ghcr.io/gsotti/stackradar:${{ steps.version.outputs.CHANNEL }}
