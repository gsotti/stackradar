name: Release App

on:
  push:
    tags:
      - 'v*-app'

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" | sed 's/-app$//' >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/gsotti/stackradar:${{ steps.version.outputs.VERSION }}
            ghcr.io/gsotti/stackradar:latest
