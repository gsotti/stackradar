name: Release Docker Collectors

on:
  push:
    tags:
      - 'v*-collectors-docker'

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: stackradar-docker-logs-collector
            context: collector-docker/logs
          - name: stackradar-docker-stats-collector
            context: collector-docker/stats

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME%-collectors-docker}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.VERSION }}
            BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/gsotti/${{ matrix.name }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/gsotti/${{ matrix.name }}:latest
