apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "logs-collector.fullname" . }}
  labels:
    {{- include "logs-collector.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "logs-collector.fullname" . }}
  labels:
    {{- include "logs-collector.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "logs-collector.fullname" . }}
  labels:
    {{- include "logs-collector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "logs-collector.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "logs-collector.fullname" . }}
    namespace: {{ .Release.Namespace }}
