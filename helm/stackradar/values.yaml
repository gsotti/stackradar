# StackRadar Helm Chart Values

replicaCount: 1

image:
  repository: ghcr.io/gsotti/stackradar
  tag: latest
  pullPolicy: IfNotPresent

# Domain where StackRadar will be accessible
domain: stackradar.example.com

# Cert-manager ClusterIssuer name
certIssuer: letsencrypt-prod

# App URL used in invitation emails (defaults to https://<domain>)
appUrl: ""

# Comma-separated allowed CORS origins (defaults to https://<domain>)
allowedOrigins: ""

# Node.js clustering (set to false for single-process, e.g. when using HPA)
clusterMode: false

# Database connection
database:
  host: postgres
  port: 5432
  name: stackradar
  user: stackradar
  password: changeme

# Admin user credentials (created on first startup)
admin:
  email: admin@stackradar.local
  password: changeme
  name: Admin User

# Default tenant (created on first startup)
tenant:
  name: Default

# Security secrets
secrets:
  jwtSecret: change-this-to-a-secure-random-string
  adminApiKey: change-this-to-a-secure-random-string

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Service configuration
service:
  type: ClusterIP
  port: 80

# Ingress configuration
ingress:
  className: traefik

# Optional: Image pull secrets
imagePullSecrets: []
