# StackRadar Helm Chart Values

replicaCount: 1

image:
  repository: ghcr.io/gsotti/stackradar
  tag: latest
  pullPolicy: IfNotPresent

# Domain where StackRadar will be accessible
domain: stackradar.example.com

# Cert-manager ClusterIssuer name
certIssuer: letsencrypt-prod

# Database connection
database:
  host: postgres
  port: 5432
  name: stackradar
  user: stackradar
  password: changeme

# Admin user credentials (created on first startup)
admin:
  email: admin@stackradar.local
  password: changeme
  name: Admin User

# Security secrets
secrets:
  jwtSecret: change-this-to-a-secure-random-string
  adminApiKey: change-this-to-a-secure-random-string

# Resource limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Service configuration
service:
  type: ClusterIP
  port: 80

# Ingress configuration
ingress:
  className: traefik

# Optional: Image pull secrets
imagePullSecrets: []
