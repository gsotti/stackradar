{{- if .Values.metricsCollector.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "logpilot.fullname" . }}-k8s-collector
  labels:
    {{- include "logpilot.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.metricsCollector.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ include "logpilot.fullname" . }}-collector
          restartPolicy: OnFailure
          containers:
            - name: collector
              image: "{{ .Values.metricsCollector.image.repository }}:{{ .Values.metricsCollector.image.tag }}"
              env:
                - name: LOGPILOT_URL
                  value: "http://{{ include "logpilot.fullname" . }}:{{ .Values.service.port }}"
                - name: API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "logpilot.fullname" . }}-collector-secret
                      key: api-token
                - name: CLUSTER_NAME
                  value: {{ .Values.metricsCollector.clusterName | default "default" | quote }}
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "logpilot.fullname" . }}-collector
  labels:
    {{- include "logpilot.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "logpilot.fullname" . }}-collector
  labels:
    {{- include "logpilot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "namespaces", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "logpilot.fullname" . }}-collector
  labels:
    {{- include "logpilot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "logpilot.fullname" . }}-collector
subjects:
  - kind: ServiceAccount
    name: {{ include "logpilot.fullname" . }}-collector
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logpilot.fullname" . }}-collector-secret
  labels:
    {{- include "logpilot.labels" . | nindent 4 }}
type: Opaque
data:
  # You need to manually set this to your system's API token
  api-token: {{ .Values.metricsCollector.apiToken | default "REPLACE_WITH_YOUR_API_TOKEN" | b64enc | quote }}
{{- end }}
