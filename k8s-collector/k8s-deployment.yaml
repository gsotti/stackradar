---
apiVersion: v1
kind: Namespace
metadata:
  name: logpilot-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logpilot-collector
  namespace: logpilot-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logpilot-collector
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - persistentvolumeclaims
      - namespaces
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logpilot-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logpilot-collector
subjects:
  - kind: ServiceAccount
    name: logpilot-collector
    namespace: logpilot-system
---
apiVersion: v1
kind: Secret
metadata:
  name: logpilot-config
  namespace: logpilot-system
type: Opaque
stringData:
  # REQUIRED: Replace with your LogPilot URL
  LOGPILOT_URL: "https://sweeping-monthly-cicada.ngrok-free.app"
  # REQUIRED: Replace with your API token from LogPilot
  API_TOKEN: "eecb539d9f9e4b05a084bfb6d783e6284a70341c67c643e5ae795cf2e493c05b"
  # OPTIONAL: Name your cluster
  CLUSTER_NAME: "Raan Circulate V2 Dev Cluster"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: logpilot-collector
  namespace: logpilot-system
spec:
  # Run every 5 minutes
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: logpilot-collector
        spec:
          serviceAccountName: logpilot-collector
          restartPolicy: OnFailure
          containers:
            - name: collector
              # REQUIRED: Build and push this image to your registry
              # Example: docker build -t your-registry.com/logpilot-collector:latest .
              #          docker push your-registry.com/logpilot-collector:latest
              image: your-registry.com/logpilot-collector:latest
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: logpilot-config
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "100m"
                limits:
                  memory: "128Mi"
                  cpu: "200m"
