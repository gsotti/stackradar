---
apiVersion: v1
kind: Namespace
metadata:
  name: stackradar-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stackradar-stats-collector
  namespace: stackradar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stackradar-stats-collector
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stackradar-stats-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stackradar-stats-collector
subjects:
  - kind: ServiceAccount
    name: stackradar-stats-collector
    namespace: stackradar-system
---
apiVersion: v1
kind: Secret
metadata:
  name: stackradar-stats-config
  namespace: stackradar-system
type: Opaque
stringData:
  # REQUIRED: Replace with your stackradar URL
  STACKRADAR_URL: "https://your-stackradar-instance.com"
  # REQUIRED: Replace with your API token from stackradar
  API_TOKEN: "your-api-token-here"
  # OPTIONAL: Name your cluster
  CLUSTER_NAME: "my-cluster"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackradar-stats-collector
  namespace: stackradar-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stackradar-stats-collector
  template:
    metadata:
      labels:
        app: stackradar-stats-collector
    spec:
      serviceAccountName: stackradar-stats-collector
      containers:
        - name: stats-collector
          # REQUIRED: Build and push this image to your registry
          # Example: docker build -t ghcr.io/gsotti/stackradar-k8s-stats-collector:latest .
          #          docker push ghcr.io/gsotti/stackradar-k8s-stats-collector:latest
          image: ghcr.io/gsotti/stackradar-k8s-stats-collector:latest
          imagePullPolicy: Always
          env:
            # Collection interval in milliseconds (default: 10000 = 10 seconds)
            - name: COLLECTION_INTERVAL
              value: "10000"
          envFrom:
            - secretRef:
                name: stackradar-stats-config
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "64Mi"
              cpu: "150m"
