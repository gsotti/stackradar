---
apiVersion: v1
kind: Namespace
metadata:
  name: stackradar-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stackradar-log-collector-__APP_NAME__
  namespace: stackradar-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stackradar-log-collector-__APP_NAME__
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stackradar-log-collector-__APP_NAME__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stackradar-log-collector-__APP_NAME__
subjects:
  - kind: ServiceAccount
    name: stackradar-log-collector-__APP_NAME__
    namespace: stackradar-system
---
apiVersion: v1
kind: Secret
metadata:
  name: stackradar-log-config-__APP_NAME__
  namespace: stackradar-system
type: Opaque
stringData:
  # REQUIRED: Replace with your stackradar URL
  STACKRADAR_URL: "https://your-stackradar-instance.com"
  # REQUIRED: Replace with your API token from stackradar
  API_TOKEN: "your-api-token-here"
  # OPTIONAL: Name your cluster
  CLUSTER_NAME: "my-cluster"
  # OPTIONAL: Number of log lines to collect (default: 100)
  LOG_TAIL_LINES: "100"
  # OPTIONAL: Polling interval in milliseconds (default: 10000)
  POLL_INTERVAL: "1000"
  # OPTIONAL: Whether to continuously follow logs (default: true)
  FOLLOW_LOGS: "true"
---
# Example: Deployment to collect logs from a specific pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackradar-log-collector-__APP_NAME__
  namespace: stackradar-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stackradar-log-collector
      target: example-app
  template:
    metadata:
      labels:
        app: stackradar-log-collector
        target: example-app
    spec:
      serviceAccountName: stackradar-log-collector-__APP_NAME__
      containers:
        - name: log-collector
          # REQUIRED: Build and push this image to your registry
          # Example: docker build -t ghcr.io/gsotti/stackradar-k8s-logs-collector:latest .
          #          docker push ghcr.io/gsotti/stackradar-k8s-logs-collector:latest
          image: ghcr.io/gsotti/stackradar-k8s-logs-collector:latest
          imagePullPolicy: Always
          env:
            # REQUIRED: Specify the pod to collect logs from
            - name: POD_NAMESPACE
              value: "pod_namespace"
            - name: POD_LABEL_SELECTOR
              value: "pod_label_selector"
            - name: POD_NAME
              value: "pod_name"
            - name: APP_NAME
              value: "__APP_NAME__"
            - name: ENVIRONMENT
              value: "environment"
          envFrom:
            - secretRef:
                name: stackradar-log-config-__APP_NAME__
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
