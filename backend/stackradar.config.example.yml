# =============================================================================
# StackRadar Declarative Configuration Example
# =============================================================================
#
# Place this file at backend/stackradar.config.yml or set STACKRADAR_CONFIG
# env var to a custom path. The database syncs to match on every startup.
#
# ENVIRONMENT VARIABLE SUBSTITUTION
#   Use ${VAR_NAME} in password, api_token, auth_password, and webhook_url
#   fields. The server aborts if any referenced variable is unset.
#
# UPSERT SEMANTICS
#   All resources are created-or-updated on every startup. Natural keys:
#     organization        → name
#     tenant              → name (within organization)
#     user                → email
#     site                → name (within tenant)
#     environment         → name (within site)
#     system              → name (within environment)
#     uptime_monitor      → name (within site)
#     notification_channel → name (within site)
#     alert_rule          → name (within site)
#
# ORPHAN HANDLING
#   Resources absent from config are handled as follows:
#     - Alert rules, notification channels, uptime monitors → hard deleted
#     - Tenants, sites, environments, systems → rows preserved (no data loss),
#       but user_tenants links are removed
#     - Users → set is_active=false, user_tenants links removed
#     - Superadmin users → never touched
#   Re-adding a removed tenant/site reuses the existing row and all its
#   historical data (logs, metrics) becomes visible again.
#
# DATA HIERARCHY
#   organization
#     └── tenants (customers / business units)
#           └── sites (clusters / Docker hosts / infrastructure)
#                 ├── environments (prod / staging / dev)
#                 │     └── systems (containers / helm releases / apps)
#                 ├── uptime_monitors
#                 ├── notification_channels
#                 └── alert_rules
#
# =============================================================================

organizations:
  - name: "My Company"
    description: "Main organization managing multiple customers"

    # -------------------------------------------------------------------------
    # SMTP (optional)
    # -------------------------------------------------------------------------
    # Used for email alert notifications and invitation emails.
    # Omit entirely to disable email notifications.
    smtp:
      host: smtp.example.com
      port: 587
      secure: false
      auth_user: alerts@example.com
      auth_password: ${SMTP_PASSWORD}
      from_email: alerts@example.com
      from_name: "StackRadar Alerts"

    # -------------------------------------------------------------------------
    # Users
    # -------------------------------------------------------------------------
    # global_role: org_admin → manages the organization and all tenants
    # (omit)                 → regular user, access governed by tenants list
    #
    # Tenant roles: tenant_admin | editor | viewer
    users:
      - email: admin@example.com
        name: Admin User
        password: ${ADMIN_PASSWORD}
        global_role: org_admin
        tenants:
          - tenant: "Customer A"
            role: tenant_admin
          - tenant: "Customer B"
            role: tenant_admin

      - email: dev@example.com
        name: Developer
        password: ${DEV_PASSWORD}
        # No global_role — regular user with access only to assigned tenants.
        tenants:
          - tenant: "Customer A"
            role: editor

    # -------------------------------------------------------------------------
    # Tenants (customers / business units)
    # -------------------------------------------------------------------------
    # Each tenant represents a customer or business unit. Users see only the
    # tenants they are assigned to.
    tenants:

      # -----------------------------------------------------------------------
      # Tenant: Customer A
      # -----------------------------------------------------------------------
      - name: "Customer A"
        description: "Customer A workspace"
        sites:

          # --- Production Kubernetes cluster ---------------------------------
          # A site represents a collection point — a Kubernetes cluster,
          # Docker host, or generic log source. The api_token authenticates
          # collector ingest requests.
          #
          # site_type: kubernetes | docker | generic
          # has_metrics: true enables the metrics dashboard and metric alerts
          # retention_days: log and metrics retention window (default: 30)
          - name: customer-a-prod-k8s
            description: "Customer A production Kubernetes cluster"
            api_token: ${CUSTOMER_A_PROD_TOKEN}
            site_type: kubernetes
            retention_days: 90
            has_metrics: true

            # Environments subdivide a site. Systems are individual apps,
            # containers, or helm releases within an environment.
            environments:
              - name: prod
                display_name: Production
                systems:
                  - name: web-app
                  - name: api-server
                  - name: background-worker

            # Uptime monitors perform periodic HTTP checks.
            # is_main: true marks the primary monitor for the site dashboard.
            uptime_monitors:
              - name: Customer A Website
                url: https://customer-a.example.com
                method: GET
                interval_seconds: 60
                expected_status: 200
                is_main: true

            # Notification channels receive alert notifications.
            # Types: email (requires email_recipients) or webhook (requires webhook_url).
            notification_channels:
              - name: ops-email
                channel_type: email
                email_recipients:
                  - ops@example.com
                  - oncall@example.com
              - name: slack-alerts
                channel_type: webhook
                webhook_url: ${SLACK_WEBHOOK_URL}

            # Alert rules evaluate metrics or uptime and fire notifications.
            # notification_channels references channel names defined above.
            # monitor references an uptime_monitor name defined above.
            alert_rules:
              - name: high-cpu
                alert_type: metric
                metric_type: cpu_percent
                threshold_operator: ">"
                threshold_value: 90
                severity: critical
                notification_channels:
                  - ops-email
                  - slack-alerts
              - name: high-memory
                alert_type: metric
                metric_type: memory_percent
                threshold_operator: ">"
                threshold_value: 85
                severity: warning
                notification_channels:
                  - ops-email
              - name: site-down
                alert_type: uptime
                monitor: Customer A Website
                severity: critical
                notification_channels:
                  - ops-email
                  - slack-alerts

          # --- Development Docker host ---------------------------------------
          # Minimal config — no monitors or alerts (add via UI as needed).
          - name: customer-a-dev-docker
            description: "Customer A dev Docker host"
            api_token: ${CUSTOMER_A_DEV_TOKEN}
            site_type: docker
            retention_days: 14
            has_metrics: true
            environments:
              - name: dev
                display_name: Development
                systems:
                  - name: web-app
                  - name: api-server

      # -----------------------------------------------------------------------
      # Tenant: Customer B (minimal setup)
      # -----------------------------------------------------------------------
      - name: "Customer B"
        description: "Customer B workspace"
        sites:
          - name: customer-b-prod-k8s
            description: "Customer B production cluster"
            api_token: ${CUSTOMER_B_PROD_TOKEN}
            site_type: kubernetes
            retention_days: 60
            has_metrics: true
            environments:
              - name: prod
                display_name: Production
                systems:
                  - name: main-app
              - name: staging
                display_name: Staging
                systems:
                  - name: main-app
